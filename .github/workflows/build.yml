name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project AruKeiba.xcodeproj \
            -scheme AruKeiba \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: |BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/AruKeiba.app

      - name: Package IPA (ad-hoc signed with HealthKit entitlements)
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AruKeiba.app Payload/
          codesign --force --sign - --timestamp=none \
            --entitlements AruKeiba/AruKeiba.entitlements \
            Payload/AruKeiba.app
          codesign -d --entitlements - Payload/AruKeiba.app
          zip -qry AruKeiba.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AruKeiba-ipa
          path: AruKeiba.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
