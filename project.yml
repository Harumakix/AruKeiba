name: AruKeiba
options:
  bundleIdPrefix: jp.arukeiba
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AruKeiba:
    type: application
    platform: iOS
    sources:
      - path: AruKeiba
    dependencies:
      - sdk: HealthKit.framework
    info:
      path: AruKeiba/Info.plist
      properties:
        CFBundleDisplayName: AruKeiba
        CFBundleDevelopmentRegion: ja
        NSHealthShareUsageDescription: 平日の歩数を集計してノルマ達成を判定するために、ヘルスケアの歩数を読み取ります。
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - healthkit
    entitlements:
      path: AruKeiba/AruKeiba.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        # ↓ 他の人とかぶらない文字列にしておくと安全（例: jp.自分の名前.arukeiba）
        PRODUCT_BUNDLE_IDENTIFIER: jp.arukeiba.steps
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    scheme: {}
